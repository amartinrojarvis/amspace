[package]
name = "amspace"
version = "0.9.17"
edition = "2024"
rust-version = "1.85"
description = "A quiet, native macOS menu bar companion for Spaces and focus"
license = "MIT"
repository = "https://github.com/amartinrojarvis/amspace"

[dependencies]
libc = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSRunLoop", "NSObjCRuntime", "objc2-core-foundation"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
